repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict

  # Tool versions come from poetry.lock, so hooks and CI cannot drift apart.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint and import order)
        entry: poetry run ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black (format)
        entry: poetry run black
        language: system
        types: [python]
      - id: djlint-reformat
        name: djlint (format templates)
        entry: poetry run djlint --reformat
        language: system
        files: ^products/templates/.*\.html$
      - id: djlint-lint
        name: djlint (lint templates)
        entry: poetry run djlint --lint
        language: system
        files: ^products/templates/.*\.html$
